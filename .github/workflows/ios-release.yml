name: ios-release

on:
  workflow_dispatch:
    inputs:
      release:
        type: choice
        default: full
        options:
          - full
          - pre
        description: Whether to make a release, choose full release (uses platform/ios/VERSION) or pre-release
      pre_release_version:
        type: string
        default: ''
        description: Version (only for pre-releases)

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  ios-release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          fetch-depth: 0

      - name: Verify release commit belongs to main
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::iOS releases must point to a commit already merged into main."
            exit 1
          fi

      - name: Validate release version and changelog
        run: |
          if [ "${{ inputs.release }}" = "full" ]; then
            .github/scripts/validate-version.sh platform/ios/VERSION
            version="$(cat platform/ios/VERSION)"
            if ! grep -Fqx "## $version" platform/ios/CHANGELOG.md; then
              echo "::error::Missing exact changelog heading: ## $version"
              exit 1
            fi
          elif [[ -n "${{ inputs.pre_release_version }}" && "${{ inputs.pre_release_version }}" != *pre* ]]; then
            echo "::error::Pre-release version must include 'pre'."
            exit 1
          fi

      - name: Verify iOS release credentials and distribution access
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN || secrets.COCOAPODS_PASSWORD }}
          GH_TOKEN: ${{ secrets.MAPVINA_RELEASE_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "::error::Missing required secret: COCOAPODS_TRUNK_TOKEN"
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing required secret: MAPVINA_RELEASE_TOKEN"
            exit 1
          fi
          if [ "$(gh api repos/mapvina/mapvina-gl-native-distribution --jq '.permissions.push // false')" != "true" ]; then
            echo "::error::MAPVINA_RELEASE_TOKEN cannot write mapvina-gl-native-distribution."
            exit 1
          fi

  ios-build-dynamic:
    needs: ios-release-preflight
    runs-on: macos-14
    defaults:
      run:
        working-directory: platform/ios
        shell: bash
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          submodules: recursive

      - name: Build XCFramework (Dynamic)
        run: |
          bazel build --compilation_mode=opt --features=dead_strip,thin_lto --objc_enable_binary_stripping \
            --apple_generate_dsym --output_groups=+dsyms --//:renderer=metal //platform/ios:MapVina.dynamic --embed_label=mapvina_ios_"$(cat VERSION)"
          echo xcframework="$(bazel info execution_root)"/"$(bazel cquery --output=files --compilation_mode=opt --//:renderer=metal //platform/ios:MapVina.dynamic)" >> "$GITHUB_ENV"

      - name: Create .zip with debug symbols
        working-directory: ./bazel-bin/platform/ios/MapVina.dynamic_dsyms
        run: |
          zip MapVina_ios_device.framework.dSYM.zip MapVina_ios_device.framework.dSYM/Contents/Resources/DWARF/MapVina_ios_device MapVina_ios_device.framework.dSYM/Contents/Info.plist
          echo debug_symbols_ios="$(realpath MapVina_ios_device.framework.dSYM.zip)" >> "$GITHUB_ENV"

      - name: Copy debug symbols to root
        working-directory: .
        run: cp ${{ env.debug_symbols_ios }} .

      - name: Add license to XCFramework zip
        run: |
          cp ${{ env.xcframework }} MapVina.dynamic.xcframework.zip
          chmod +w MapVina.dynamic.xcframework.zip
          zip MapVina.dynamic.xcframework.zip LICENSE.md  # add license to zip
        working-directory: .

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: xcframework
          path: |
            MapVina.dynamic.xcframework.zip
            MapVina_ios_device.framework.dSYM.zip

  ios-build-static:
    needs: ios-release-preflight
    runs-on: macos-14
    defaults:
      run:
        working-directory: platform/ios
        shell: bash
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          submodules: recursive

      - name: Build XCFramework (Static)
        # for now, just build it TODO: make a static framework release
        run: |
          bazel build //platform/ios:MapVina.static --//:renderer=metal --compilation_mode="opt" --copt -g --copt="-Oz" --strip never --output_groups=+dsyms --apple_generate_dsym
          echo xcframework_static="$(bazel info execution_root)"/"$(bazel cquery --output=files --compilation_mode=opt --//:renderer=metal //platform/ios:MapVina.static)" >> "$GITHUB_ENV"

      - name: Add license to XCFramework zip
        run: |
          cp ${{ env.xcframework_static }} MapVina.static.xcframework.zip
          chmod +w MapVina.static.xcframework.zip
          zip MapVina.static.xcframework.zip LICENSE.md  # add license to zip
        working-directory: .

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: xcframework-static
          path: |
            MapVina.static.xcframework.zip

  ios-stage-release:
    permissions:
      contents: write
    outputs:
      version: ${{ steps.normalized_release.outputs.version }}
      tag: ${{ steps.normalized_release.outputs.tag }}
      final_prerelease: ${{ steps.normalized_release.outputs.final_prerelease }}
    runs-on: ubuntu-latest
    needs:
      - ios-build-dynamic
      - ios-build-static
    defaults:
      run:
        working-directory: platform/ios
        shell: bash
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v4
        with:
          node-version-file: ".nvmrc"

      - name: Get version (release)
        id: release_version
        if: github.event.inputs.release == 'full'
        run: |
          version="$(head VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=ios-v$version" >> "$GITHUB_OUTPUT"
          echo "changelog_version_heading=## $version" >> "$GITHUB_OUTPUT"
          echo "final_prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Get version (pre-release)
        id: prerelease_version
        if: github.event.inputs.release == 'pre'
        run: |
          version="${{ github.event.inputs.pre_release_version }}"
          if [[ -z "$version" ]]; then
            version="$(head VERSION)"-pre${{ github.sha }}
          fi
          if [[ "$version" != *"pre"* ]]; then
            echo "::error::Pre-release version must include 'pre' (Current version: $version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=ios-v$version" >> "$GITHUB_OUTPUT"
          echo "changelog_version_heading=## main" >> "$GITHUB_OUTPUT"
          echo "final_prerelease=true" >> "$GITHUB_OUTPUT"

      - name: Normalize release outputs
        id: normalized_release
        run: |
          if [ "${{ github.event.inputs.release }}" = "full" ]; then
            echo "version=${{ steps.release_version.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.release_version.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "changelog_version_heading=${{ steps.release_version.outputs.changelog_version_heading }}" >> "$GITHUB_OUTPUT"
            echo "final_prerelease=${{ steps.release_version.outputs.final_prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.prerelease_version.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.prerelease_version.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "changelog_version_heading=${{ steps.prerelease_version.outputs.changelog_version_heading }}" >> "$GITHUB_OUTPUT"
            echo "final_prerelease=${{ steps.prerelease_version.outputs.final_prerelease }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Export normalized release outputs
        run: |
          echo "version=${{ steps.normalized_release.outputs.version }}" >> "$GITHUB_ENV"
          echo "tag=${{ steps.normalized_release.outputs.tag }}" >> "$GITHUB_ENV"
          echo "changelog_version_heading=${{ steps.normalized_release.outputs.changelog_version_heading }}" >> "$GITHUB_ENV"
          echo "final_prerelease=${{ steps.normalized_release.outputs.final_prerelease }}" >> "$GITHUB_ENV"

      - name: Create tag if it does not exist
        working-directory: .
        run: .github/scripts/ensure-tag.sh ${{ env.tag }} ${{ github.sha }}

      - name: Extract changelog for version
        run: |
          awk '/^##/ { p = 0 }; p == 1 { print }; $0 == "${{ env.changelog_version_heading }}" { p = 1 };' CHANGELOG.md > changelog_for_version.md
          cat changelog_for_version.md

      - name: Stage public GitHub pre-release
        id: github_release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          name: ${{ env.tag }}
          files: |
            xcframework/MapVina.dynamic.xcframework.zip
            xcframework/MapVina_ios_device.framework.dSYM.zip
            xcframework-static/MapVina.static.xcframework.zip
          tag_name: ${{ env.tag }}
          prerelease: true
          body_path: platform/ios/changelog_for_version.md
          fail_on_unmatched_files: true

  ios-release-cocoapods:
    needs: ios-stage-release
    runs-on: macos-14
    defaults:
      run:
        working-directory: platform/ios
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false

      - name: Validate CocoaPods specification
        run: VERSION=${{ needs.ios-stage-release.outputs.version }} pod spec lint MapVina.podspec --allow-warnings

      - name: Publish CocoaPods specification
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN || secrets.COCOAPODS_PASSWORD }}
        run: VERSION=${{ needs.ios-stage-release.outputs.version }} pod trunk push MapVina.podspec --allow-warnings

  ios-release-spm:
    needs: ios-stage-release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Swift Package distribution release
        env:
          GH_TOKEN: ${{ secrets.MAPVINA_RELEASE_TOKEN }}
          VERSION: ${{ needs.ios-stage-release.outputs.version }}
          TAG: ${{ needs.ios-stage-release.outputs.tag }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run release.yml \
            --repo mapvina/mapvina-gl-native-distribution \
            --ref main \
            --field version="$VERSION" \
            --field changelog_url="https://github.com/mapvina/mapvina-native/releases/tag/$TAG" \
            --field download_url="https://github.com/mapvina/mapvina-native/releases/download/$TAG/MapVina.dynamic.xcframework.zip"

          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list \
              --repo mapvina/mapvina-gl-native-distribution \
              --workflow release.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt,displayTitle | \
              jq -r --arg since "$dispatched_at" --arg title "release-$VERSION" \
                '[.[] | select(.createdAt >= $since and .displayTitle == $title)] | sort_by(.createdAt) | last | .databaseId // empty')"
            [ -n "$run_id" ] && break
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "Unable to locate the Swift Package distribution workflow run." >&2
            exit 1
          fi

          gh run watch "$run_id" --repo mapvina/mapvina-gl-native-distribution --exit-status
          gh api "repos/mapvina/mapvina-gl-native-distribution/git/ref/tags/$VERSION" >/dev/null

          expected_url="https://github.com/mapvina/mapvina-native/releases/download/$TAG/MapVina.dynamic.xcframework.zip"
          package_manifest="$(gh api "repos/mapvina/mapvina-gl-native-distribution/contents/Package.swift?ref=$VERSION" --jq .content | base64 --decode)"
          if ! grep -Fq "url: \"$expected_url\"" <<< "$package_manifest"; then
            echo "Swift Package tag $VERSION does not reference $expected_url" >&2
            exit 1
          fi

  ios-finalize-release:
    permissions:
      contents: write
      issues: write
    needs:
      - ios-stage-release
      - ios-release-cocoapods
      - ios-release-spm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4

      - name: Finalize GitHub release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.ios-stage-release.outputs.tag }}
          FINAL_PRERELEASE: ${{ needs.ios-stage-release.outputs.final_prerelease }}
        run: |
          release_id="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id)"
          gh api --method PATCH "repos/${{ github.repository }}/releases/$release_id" \
            -F draft=false \
            -F prerelease="$FINAL_PRERELEASE"

      - run: npm ci

      - name: Write release notifications
        if: github.repository_owner == 'mapvina'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/notify-release-on-prs.ts --tag ${{ needs.ios-stage-release.outputs.tag }}
