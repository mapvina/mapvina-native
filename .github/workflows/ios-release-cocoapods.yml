name: ios-release-cocoapods

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

jobs:
  ios-release-cocoapods:
    defaults:
      run:
        working-directory: platform/ios
    runs-on: macos-14
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v4
        with:
          persist-credentials: false

      - name: Validate CocoaPods specification
        shell: bash -leo pipefail {0}
        run: VERSION=${{ inputs.version }} pod spec lint MapVina.podspec --allow-warnings

      - name: Release (CocoaPods)
        shell: bash -leo pipefail {0}
        run: |
          VERSION=${{ inputs.version }} COCOAPODS_TRUNK_TOKEN=${{ secrets.COCOAPODS_TRUNK_TOKEN }} \
            pod trunk push MapVina.podspec --allow-warnings
